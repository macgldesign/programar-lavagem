<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Programar Lavagem</title>
  <meta name="description" content="Calcule quantas horas de atraso programar na máquina de lavar para terminar no horário desejado.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lavagem">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <!-- Google Fonts: Inter para UI geral, Roboto Mono para hora atual e Roboto Condensed para timeline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Condensed:wght@600;700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --surface: #f8fafc;
      --border: #e2e8f0;
      --text: #1e293b;
      --label: #334155;
      --muted: #64748b;
      --faint: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-active: #1e40af;
      --clock: #1e3a8a;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #dc2626;
      --amber-bg: #fffbeb;
      --amber-border: #fde68a;
      --amber-text: #92400e;
      --blue-bg: #eff6ff;
      --blue-border: #bfdbfe;
      --blue-text: #1e40af;
      --blue-dot: #2563eb;
      --indigo-dot: #6366f1;
      --emerald-dot: #10b981;
      --blue-strong: #1d4ed8;
      --indigo-strong: #4338ca;
      --emerald-strong: #047857;
      --blue-tag: #dbeafe;
      --indigo-tag: #e0e7ff;
      --emerald-tag: #d1fae5;
      --line: #bfdbfe;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --surface: #171717;
        --border: #2e2e2e;
        --text: #e5e5e5;
        --label: #d4d4d4;
        --muted: #a3a3a3;
        --faint: #737373;
        --clock: #93c5fd;
        --danger-bg: rgba(220, 38, 38, 0.12);
        --danger-border: rgba(248, 113, 113, 0.35);
        --danger-text: #f87171;
        --amber-bg: rgba(245, 158, 11, 0.12);
        --amber-border: rgba(251, 191, 36, 0.3);
        --amber-text: #fcd34d;
        --blue-bg: rgba(59, 130, 246, 0.12);
        --blue-border: rgba(96, 165, 250, 0.3);
        --blue-text: #93c5fd;
        --blue-strong: #60a5fa;
        --indigo-strong: #a5b4fc;
        --emerald-strong: #34d399;
        --blue-tag: rgba(59, 130, 246, 0.2);
        --indigo-tag: rgba(99, 102, 241, 0.2);
        --emerald-tag: rgba(16, 185, 129, 0.2);
        --line: #3a3a3a;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    /* Impede o "puxar para atualizar" e o efeito elástico de rolagem */
    html, body {
      overscroll-behavior: none;
      background: var(--bg);
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }

    /* Evita seleção acidental apenas em elementos de interface */
    button, label, h1, h2, .no-select {
      -webkit-user-select: none;
      user-select: none;
    }

    button { font: inherit; cursor: pointer; }

    .app { width: 100%; max-width: 28rem; padding: 20px; }

    /* Cabeçalho */
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .clock {
      margin: 12px auto 0;
      max-width: 20rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
    }
    .clock span {
      display: block;
      font-size: 0.75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--faint);
      margin-bottom: 4px;
    }
    .clock div {
      font-family: 'Roboto Mono', ui-monospace, monospace;
      font-size: 2.25rem; font-weight: 700; line-height: 1;
      letter-spacing: -0.025em;
      color: var(--clock);
      font-variant-numeric: tabular-nums;
    }

    /* Formulário */
    .form > * + * { margin-top: 16px; }
    .field-label {
      display: block;
      font-size: 0.875rem; font-weight: 700;
      color: var(--label);
      margin-bottom: 6px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .input-wrap { position: relative; }
    .input {
      width: 100%;
      font: inherit;
      font-size: 1.125rem; font-weight: 700;
      padding: 14px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
      appearance: none;
      min-height: 56px;
    }
    .input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25); }
    .input.has-suffix { padding-right: 44px; }
    .suffix {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      font-size: 0.75rem; font-weight: 600; color: var(--faint);
      pointer-events: none;
    }
    .hint { font-size: 0.75rem; color: var(--faint); margin: 4px 0 0 4px; }

    /* Programas salvos */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .chips:empty { display: none; }
    .chip {
      display: inline-flex; align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.8125rem; font-weight: 600;
      color: var(--label);
      overflow: hidden;
    }
    .chip.active { border-color: var(--primary); color: var(--primary); }
    .chip button { background: none; border: 0; color: inherit; padding: 8px 4px 8px 12px; }
    .chip .chip-remove { padding: 8px 10px 8px 6px; color: var(--faint); font-size: 1rem; line-height: 1; }
    .link-btn {
      background: none; border: 0; padding: 4px 0;
      font-size: 0.8125rem; font-weight: 600; color: var(--primary);
    }
    .save-row { display: flex; gap: 8px; margin-top: 8px; }
    .save-row[hidden] { display: none; }
    .save-row .input { font-size: 1rem; font-weight: 600; min-height: 44px; padding: 10px 12px; }
    .small-btn {
      flex-shrink: 0;
      background: var(--primary); color: #fff;
      border: 0; border-radius: 12px;
      padding: 0 16px; font-weight: 700; font-size: 0.875rem;
    }

    /* Configuração do timer */
    .settings summary {
      cursor: pointer;
      font-size: 0.8125rem; font-weight: 600;
      color: var(--muted);
      list-style: none;
      -webkit-user-select: none; user-select: none;
    }
    .settings summary::-webkit-details-marker { display: none; }
    .settings summary::before { content: '⚙️ '; }
    .settings[open] summary { margin-bottom: 8px; }
    .settings .row { display: flex; align-items: center; gap: 12px; }
    .settings .row .input-wrap { width: 110px; flex-shrink: 0; }
    .settings .row .input { font-size: 1rem; min-height: 44px; padding: 10px 12px; }
    .settings p { margin: 0; font-size: 0.75rem; color: var(--muted); }

    /* Botão principal */
    .btn-primary {
      width: 100%;
      padding: 16px;
      color: #fff;
      font-weight: 800; font-size: 1rem;
      text-transform: uppercase; letter-spacing: 0.05em;
      border: 0; border-radius: 16px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
    }
    .btn-primary:active {
      transform: translateY(1px);
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.2);
    }
    .btn-primary:focus-visible, .link-btn:focus-visible, .chip button:focus-visible {
      outline: 2px solid var(--primary); outline-offset: 2px;
    }

    /* Resultado */
    .result { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
    .result h2 {
      margin: 0 0 12px;
      font-size: 0.875rem; font-weight: 800;
      color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.05em;
      display: flex; align-items: center; gap: 6px;
    }
    .result-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }
    .placeholder { margin: 0; padding: 8px 0; text-align: center; font-size: 0.875rem; font-weight: 500; color: var(--faint); }
    .placeholder strong { color: var(--muted); }

    .alert {
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 0.875rem;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
    }
    .alert strong.title { display: block; font-weight: 800; font-size: 1rem; }
    .alert p { margin: 4px 0 0; font-size: 0.75rem; }
    .alert.warn { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber-text); margin-top: 16px; }
    .center-note { margin: 12px 0 0; text-align: center; font-size: 0.75rem; color: var(--muted); }
    .center-note strong { font-family: 'Roboto Condensed', sans-serif; font-size: 0.875rem; }

    /* Linha do tempo */
    .timeline { position: relative; padding-left: 24px; }
    .timeline::before {
      content: ''; position: absolute;
      left: 10px; top: 8px; bottom: 8px; width: 2px;
      background: var(--line);
    }
    .timeline > * + * { margin-top: 16px; }
    .point { position: relative; }
    .dot {
      position: absolute; left: -24px; top: 2px;
      width: 20px; height: 20px; border-radius: 50%;
      border: 4px solid var(--surface);
    }
    .point-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .point-time { font-family: 'Roboto Condensed', sans-serif; font-size: 1.5rem; font-weight: 700; line-height: 1; }
    .tag {
      font-size: 0.625rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      padding: 2px 8px; border-radius: 999px;
    }
    .point p { margin: 2px 0 0; font-size: 0.75rem; color: var(--muted); }
    .point.now .dot { background: var(--blue-dot); }
    .point.now .point-time { color: var(--blue-strong); }
    .point.now .tag { background: var(--blue-tag); color: var(--blue-strong); }
    .point.start .dot { background: var(--indigo-dot); }
    .point.start .point-time { color: var(--indigo-strong); }
    .point.start .tag { background: var(--indigo-tag); color: var(--indigo-strong); }
    .point.end .dot { background: var(--emerald-dot); }
    .point.end .point-time { color: var(--emerald-strong); }
    .point.end .tag { background: var(--emerald-tag); color: var(--emerald-strong); }

    .interval {
      padding: 8px 12px;
      border-radius: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .interval small { display: block; font-size: 0.75rem; font-weight: 600; }
    .interval b { font-size: 0.875rem; font-weight: 800; }
    .interval.wait { background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber-text); }
    .interval.cycle { background: var(--blue-bg); border: 1px solid var(--blue-border); color: var(--blue-text); }

    .diff { display: inline-block; margin-top: 4px; font-size: 0.75rem; font-weight: 700; color: var(--emerald-strong); }
    .footnote {
      margin: 16px 0 0; padding-top: 12px;
      border-top: 1px solid var(--border);
      text-align: center; font-size: 0.6875rem; line-height: 1.6; color: var(--faint);
    }

    .remind-btn {
      display: block; width: 100%;
      margin-top: 12px; padding: 12px;
      background: transparent;
      border: 1px solid var(--border); border-radius: 12px;
      color: var(--primary); font-weight: 700; font-size: 0.875rem;
    }
    .reminder-status {
      margin-top: 12px; padding: 10px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      border-radius: 12px;
      background: var(--blue-bg); border: 1px solid var(--blue-border); color: var(--blue-text);
      font-size: 0.8125rem; font-weight: 600;
    }
    .reminder-status[hidden] { display: none; }
    .reminder-status small { display: block; font-weight: 500; font-size: 0.6875rem; opacity: 0.8; }

    .footer { margin-top: 4px; text-align: center; line-height: 1; }
    .footer span { font-size: 9px; color: var(--faint); opacity: 0.6; letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <main class="app">

    <!-- Cabeçalho -->
    <header class="header">
      <h1><span aria-hidden="true">🧺</span> Programar Lavagem</h1>

      <div class="clock">
        <span>Hora atual</span>
        <div id="horaAtualVal" aria-live="off">--:--</div>
      </div>
    </header>

    <!-- Formulário -->
    <div class="form">
      <div>
        <label class="field-label" for="duracaoHoras">1. Duração total da lavagem:</label>

        <div id="programas" class="chips" aria-label="Programas salvos"></div>

        <div class="grid-2">
          <div class="input-wrap">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off"
              id="duracaoHoras" class="input has-suffix" placeholder="0" aria-label="Horas">
            <span class="suffix">h</span>
          </div>
          <div class="input-wrap">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off"
              id="duracaoMinutos" class="input has-suffix" placeholder="0" aria-label="Minutos">
            <span class="suffix">min</span>
          </div>
        </div>
        <p class="hint">Ex: 1h e 32 minutos.</p>
      </div>

      <div>
        <label class="field-label" for="horaTerminoDesejado">2. Horário desejado para término:</label>
        <input type="time" id="horaTerminoDesejado" class="input">

        <button type="button" id="btnMostrarSalvar" class="link-btn">+ Salvar como programa</button>
        <div id="salvarRow" class="save-row" hidden>
          <input type="text" id="nomePrograma" class="input" maxlength="20" placeholder="Nome, ex.: Algodão" aria-label="Nome do programa">
          <button type="button" id="btnSalvarPrograma" class="small-btn">Salvar</button>
        </div>
      </div>

      <details class="settings">
        <summary>Limite do timer da máquina</summary>
        <div class="row">
          <div class="input-wrap">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off"
              id="atrasoMaximo" class="input has-suffix" placeholder="24" aria-label="Atraso máximo em horas">
            <span class="suffix">h</span>
          </div>
          <p>Maior atraso que sua máquina permite programar.</p>
        </div>
      </details>

      <div>
        <button type="button" id="btnCalcular" class="btn-primary">CALCULAR ATRASO</button>
      </div>
    </div>

    <!-- Seção de Resultado (Linha do Tempo) -->
    <section class="result" aria-live="polite">
      <h2><span aria-hidden="true">✨</span> Linha do Tempo da Lavagem</h2>

      <div id="resultadoContent" class="result-box">
        <p class="placeholder">Preencha os horários e clique em <strong>CALCULAR ATRASO</strong>.</p>
      </div>

      <div id="lembreteStatus" class="reminder-status" hidden>
        <div>
          🔔 <span id="lembreteTexto"></span>
          <small>Mantenha o app aberto em segundo plano.</small>
        </div>
        <button type="button" id="btnCancelarLembrete" class="link-btn">Cancelar</button>
      </div>
    </section>

    <!-- Rodapé Ultra Discreto -->
    <footer class="footer">
      <span>by macgldesign</span>
    </footer>

  </main>

  <script>
    (function () {
      const TOLERANCIA_ATRASO_MIN = 15;
      const ATRASO_MAXIMO_PADRAO = 24;
      const CHAVES = {
        horas: "wash_duracaoHoras",
        minutos: "wash_duracaoMinutos",
        termino: "wash_horaTerminoDesejado",
        atrasoMaximo: "wash_atrasoMaximo",
        programas: "wash_programas",
        lembrete: "wash_lembrete"
      };

      const $ = id => document.getElementById(id);
      const campoHoras = $("duracaoHoras");
      const campoMinutos = $("duracaoMinutos");
      const campoTermino = $("horaTerminoDesejado");
      const campoAtrasoMax = $("atrasoMaximo");
      const containerResultado = $("resultadoContent");
      const resultadoInicial = containerResultado.innerHTML;
      const suportaNotificacao = "Notification" in window;

      // ---------- Utilitários ----------

      function pad(n) {
        return n.toString().padStart(2, "0");
      }

      // Formata a hora em HH:MM
      function formatarHora(data) {
        return pad(data.getHours()) + ":" + pad(data.getMinutes());
      }

      function formatarDuracao(totalMin) {
        const h = Math.floor(totalMin / 60);
        const m = totalMin % 60;
        if (h && m) return `${h}h ${m}min`;
        if (h) return `${h}h`;
        return `${m}min`;
      }

      function lerNumero(campo) {
        const n = parseInt(campo.value, 10);
        return Number.isFinite(n) && n > 0 ? n : 0;
      }

      function escaparHtml(texto) {
        const div = document.createElement("div");
        div.textContent = texto;
        return div.innerHTML.replace(/"/g, "&quot;");
      }

      function lerJson(chave, padrao) {
        try {
          const valor = JSON.parse(localStorage.getItem(chave));
          return valor ?? padrao;
        } catch {
          return padrao;
        }
      }

      function obterAtrasoMaximo() {
        return lerNumero(campoAtrasoMax) || ATRASO_MAXIMO_PADRAO;
      }

      // ---------- Relógio ----------

      function atualizarHoraAtual() {
        const el = $("horaAtualVal");
        const texto = formatarHora(new Date());
        if (el.textContent !== texto) el.textContent = texto;
      }

      setInterval(atualizarHoraAtual, 1000);
      atualizarHoraAtual();

      // ---------- Persistência das configurações ----------

      function salvarDados() {
        localStorage.setItem(CHAVES.horas, campoHoras.value);
        localStorage.setItem(CHAVES.minutos, campoMinutos.value);
        localStorage.setItem(CHAVES.termino, campoTermino.value);
        localStorage.setItem(CHAVES.atrasoMaximo, campoAtrasoMax.value);
      }

      function carregarDados() {
        campoHoras.value = localStorage.getItem(CHAVES.horas) || "";
        campoMinutos.value = localStorage.getItem(CHAVES.minutos) || "";
        campoTermino.value = localStorage.getItem(CHAVES.termino) || "";
        campoAtrasoMax.value = localStorage.getItem(CHAVES.atrasoMaximo) || "";
      }

      // Zera a linha do tempo quando qualquer configuração é alterada
      function resetarResultado() {
        containerResultado.innerHTML = resultadoInicial;
      }

      function aoAlterarConfiguracao() {
        salvarDados();
        resetarResultado();
        renderizarProgramas();
      }

      // Aceita apenas dígitos enquanto digita
      function somenteDigitos(campo) {
        const limpo = campo.value.replace(/\D/g, "");
        if (limpo !== campo.value) campo.value = limpo;
      }

      // Converte minutos excedentes em horas (ex.: 0h 90min → 1h 30min)
      function normalizarDuracao() {
        const total = lerNumero(campoHoras) * 60 + lerNumero(campoMinutos);
        if (lerNumero(campoMinutos) >= 60) {
          campoHoras.value = Math.floor(total / 60) || "";
          campoMinutos.value = total % 60 || "";
          aoAlterarConfiguracao();
        }
      }

      [campoHoras, campoMinutos, campoAtrasoMax].forEach(campo => {
        campo.addEventListener("input", () => {
          somenteDigitos(campo);
          aoAlterarConfiguracao();
        });
      });
      campoMinutos.addEventListener("change", normalizarDuracao);
      campoTermino.addEventListener("input", aoAlterarConfiguracao);
      campoTermino.addEventListener("change", aoAlterarConfiguracao);

      // ---------- Programas salvos ----------

      function obterProgramas() {
        const lista = lerJson(CHAVES.programas, []);
        return Array.isArray(lista) ? lista : [];
      }

      function guardarProgramas(lista) {
        localStorage.setItem(CHAVES.programas, JSON.stringify(lista));
        renderizarProgramas();
      }

      function renderizarProgramas() {
        const duracaoAtual = lerNumero(campoHoras) * 60 + lerNumero(campoMinutos);
        $("programas").innerHTML = obterProgramas().map((p, i) => {
          const ativo = p.minutos === duracaoAtual && (!p.termino || p.termino === campoTermino.value);
          return `
          <span class="chip${ativo ? " active" : ""}">
            <button type="button" data-usar="${i}">${escaparHtml(p.nome)} · ${formatarDuracao(p.minutos)}${p.termino ? ` → ${p.termino}` : ""}</button>
            <button type="button" class="chip-remove" data-remover="${i}" aria-label="Remover ${escaparHtml(p.nome)}">×</button>
          </span>
        `;
        }).join("");
      }

      $("programas").addEventListener("click", evento => {
        const botao = evento.target.closest("button");
        if (!botao) return;
        const lista = obterProgramas();

        if (botao.dataset.usar !== undefined) {
          const programa = lista[Number(botao.dataset.usar)];
          if (!programa) return;
          campoHoras.value = Math.floor(programa.minutos / 60) || "";
          campoMinutos.value = programa.minutos % 60 || "";
          if (programa.termino) campoTermino.value = programa.termino;
          aoAlterarConfiguracao();
        } else if (botao.dataset.remover !== undefined) {
          lista.splice(Number(botao.dataset.remover), 1);
          guardarProgramas(lista);
        }
      });

      $("btnMostrarSalvar").addEventListener("click", () => {
        const linha = $("salvarRow");
        linha.hidden = !linha.hidden;
        if (!linha.hidden) $("nomePrograma").focus();
      });

      function salvarPrograma() {
        const nome = $("nomePrograma").value.trim();
        const minutos = lerNumero(campoHoras) * 60 + lerNumero(campoMinutos);
        const termino = campoTermino.value;
        if (!nome) {
          $("nomePrograma").focus();
          return;
        }
        if (minutos <= 0) {
          mostrarErro("Informe a duração antes de salvar o programa.");
          return;
        }
        const lista = obterProgramas().filter(p => p.nome.toLowerCase() !== nome.toLowerCase());
        lista.push({ nome, minutos, termino });
        guardarProgramas(lista);
        $("nomePrograma").value = "";
        $("salvarRow").hidden = true;
      }

      $("btnSalvarPrograma").addEventListener("click", salvarPrograma);
      $("nomePrograma").addEventListener("keydown", evento => {
        if (evento.key === "Enter") salvarPrograma();
      });

      // ---------- Cálculo ----------

      function mostrarErro(mensagem) {
        containerResultado.innerHTML = `<div class="alert"><strong>⚠️ ${mensagem}</strong></div>`;
      }

      function calcular() {
        normalizarDuracao();
        const agora = new Date();
        agora.setSeconds(0, 0);

        const duracaoTotalMin = lerNumero(campoHoras) * 60 + lerNumero(campoMinutos);
        const horaTerminoDesejado = campoTermino.value;
        const atrasoMaximo = obterAtrasoMaximo();

        if (duracaoTotalMin <= 0) {
          mostrarErro("A duração da lavagem deve ser maior que zero.");
          return;
        }

        if (!horaTerminoDesejado) {
          mostrarErro("Por favor, informe o horário de término desejado.");
          return;
        }

        const [horaDesejada, minutoDesejado] = horaTerminoDesejado.split(":").map(Number);
        const termino = new Date(agora);
        termino.setHours(horaDesejada, minutoDesejado, 0, 0);
        if (termino < agora) {
          termino.setDate(termino.getDate() + 1);
        }

        const inicioIdeal = new Date(termino.getTime() - duracaoTotalMin * 60000);
        const atrasoIdealMin = Math.round((inicioIdeal - agora) / 60000);

        // Se perdeu o tempo
        if (atrasoIdealMin < 0) {
          const terminoImediato = new Date(agora.getTime() + duracaoTotalMin * 60000);
          containerResultado.innerHTML = `
            <div class="alert">
              <strong class="title">❌ Perdeu o tempo ideal!</strong>
              <p>Para terminar às <strong>${horaTerminoDesejado}</strong>, você deveria ter começado há
              <strong>${formatarDuracao(Math.abs(atrasoIdealMin))}</strong>.</p>
            </div>
            <p class="center-note">Se ligar a máquina agora, ela terminará às <strong>${formatarHora(terminoImediato)}</strong>.</p>
            ${botaoLembrete(terminoImediato)}
          `;
          return;
        }

        // Arredonda para a hora inteira mais próxima, sem passar mais de 15 min do horário desejado
        let atrasoHoras = Math.round(atrasoIdealMin / 60);
        if (atrasoHoras * 60 - atrasoIdealMin > TOLERANCIA_ATRASO_MIN) {
          atrasoHoras -= 1;
        }
        atrasoHoras = Math.max(atrasoHoras, 0);

        const limitadoPeloTimer = atrasoHoras > atrasoMaximo;
        if (limitadoPeloTimer) atrasoHoras = atrasoMaximo;

        const inicio = new Date(agora.getTime() + atrasoHoras * 3600000);
        const fim = new Date(inicio.getTime() + duracaoTotalMin * 60000);
        const diferencaMin = Math.round((fim - termino) / 60000);

        let textoDiferenca;
        if (diferencaMin === 0) textoDiferenca = "Exatamente no horário desejado";
        else if (diferencaMin < 0) textoDiferenca = `${formatarDuracao(-diferencaMin)} antes do horário desejado`;
        else textoDiferenca = `${formatarDuracao(diferencaMin)} depois do horário desejado`;

        const textoEspera = atrasoHoras === 0
          ? "Sem atraso, ligue agora"
          : `${atrasoHoras} hora${atrasoHoras !== 1 ? "s" : ""} de atraso`;

        // Renderização da LINHA DO TEMPO DA LAVAGEM
        containerResultado.innerHTML = `
          <div class="timeline">
            <div class="point now">
              <div class="dot"></div>
              <div class="point-head">
                <span class="point-time">${formatarHora(agora)}</span>
                <span class="tag">Agora</span>
              </div>
              <p>Momento da consulta</p>
            </div>

            <div class="interval wait">
              <span aria-hidden="true">⏳</span>
              <div>
                <small>ESPERA (TIMER DA MÁQUINA)</small>
                <b>${textoEspera}</b>
              </div>
            </div>

            <div class="point start">
              <div class="dot"></div>
              <div class="point-head">
                <span class="point-time">${formatarHora(inicio)}</span>
                <span class="tag">Início previsto</span>
              </div>
              <p>A máquina começará a lavar</p>
            </div>

            <div class="interval cycle">
              <span aria-hidden="true">🧺</span>
              <div>
                <small>CICLO DE LAVAGEM</small>
                <b>${formatarDuracao(duracaoTotalMin)}</b>
              </div>
            </div>

            <div class="point end">
              <div class="dot"></div>
              <div class="point-head">
                <span class="point-time">${formatarHora(fim)}</span>
                <span class="tag">Término previsto</span>
              </div>
              <p>Desejado: ${horaTerminoDesejado}</p>
              <span class="diff">${textoDiferenca}</span>
            </div>
          </div>

          ${limitadoPeloTimer ? `
            <div class="alert warn">
              <p>⚠️ Seu timer permite no máximo <strong>${atrasoMaximo}h</strong> de atraso, por isso a lavagem termina antes do horário desejado.</p>
            </div>` : ""}

          ${botaoLembrete(fim)}

          <p class="footnote">
            * O atraso é arredondado para horas inteiras: a lavagem termina no máximo ${TOLERANCIA_ATRASO_MIN} minutos depois do horário desejado, ou até ${60 - TOLERANCIA_ATRASO_MIN} minutos antes.
          </p>
        `;
      }

      $("btnCalcular").addEventListener("click", calcular);

      // ---------- Lembrete de término ----------

      let timerLembrete = null;

      function botaoLembrete(fim) {
        if (!suportaNotificacao) return "";
        return `<button type="button" class="remind-btn" data-lembrete="${fim.getTime()}">🔔 Avisar quando terminar (${formatarHora(fim)})</button>`;
      }

      containerResultado.addEventListener("click", async evento => {
        const botao = evento.target.closest("[data-lembrete]");
        if (!botao) return;

        const permissao = Notification.permission === "default"
          ? await Notification.requestPermission()
          : Notification.permission;

        if (permissao !== "granted") {
          botao.textContent = "Notificações bloqueadas nas configurações do aparelho";
          botao.disabled = true;
          return;
        }

        localStorage.setItem(CHAVES.lembrete, botao.dataset.lembrete);
        armarLembrete();
        botao.remove();
      });

      function armarLembrete() {
        clearTimeout(timerLembrete);
        const quando = Number(localStorage.getItem(CHAVES.lembrete));
        const status = $("lembreteStatus");

        if (!quando || !suportaNotificacao) {
          status.hidden = true;
          return;
        }

        if (quando <= Date.now()) {
          dispararLembrete();
          return;
        }

        $("lembreteTexto").textContent = `Lembrete às ${formatarHora(new Date(quando))}`;
        status.hidden = false;
        timerLembrete = setTimeout(dispararLembrete, quando - Date.now());
      }

      async function dispararLembrete() {
        const quando = Number(localStorage.getItem(CHAVES.lembrete));
        localStorage.removeItem(CHAVES.lembrete);
        $("lembreteStatus").hidden = true;

        // Ignora lembretes muito antigos (ex.: app reaberto horas depois)
        if (!quando || Date.now() - quando > 30 * 60000) return;
        if (Notification.permission !== "granted") return;

        const opcoes = { body: "A lavagem terminou. Hora de estender a roupa!", icon: "icon-192.png", badge: "icon-192.png", vibrate: [200, 100, 200], tag: "lavagem" };
        try {
          const registro = await navigator.serviceWorker?.ready;
          if (registro) {
            await registro.showNotification("🧺 Lavagem concluída", opcoes);
            return;
          }
        } catch { /* usa o fallback abaixo */ }
        new Notification("🧺 Lavagem concluída", opcoes);
      }

      $("btnCancelarLembrete").addEventListener("click", () => {
        localStorage.removeItem(CHAVES.lembrete);
        armarLembrete();
      });

      // Navegadores pausam timers em segundo plano: confere ao voltar para o app
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") armarLembrete();
      });

      // ---------- Inicialização ----------

      carregarDados();
      renderizarProgramas();
      armarLembrete();

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./service-worker.js").then(registro => {
          // Força a verificação de nova versão no servidor
          registro.update();
        });
      }
    })();
  </script>
</body>
</html>
